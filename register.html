<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Join Blogify to share your knowledge, publish tech tutorials, and connect with fellow creators.">
  <title>Create Account — Blogify</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Top Navigation Bar -->
  <header class="site-header">
    <div class="container navbar">
      <a href="index.html" class="nav-brand">
        <svg viewBox="0 0 24 24">
          <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/>
        </svg>
        <span>Blogify</span>
      </a>

      <ul class="nav-links" id="navLinksMenu">
        <li><a href="index.html" class="nav-link">Home</a></li>
        <li><a href="index.html#explore" class="nav-link">Explore Blogs</a></li>
        <li><a href="dashboard.html" class="nav-link">Dashboard</a></li>
      </ul>

      <div class="nav-actions" id="navAuthActions">
        <a href="login.html" class="btn btn-outline btn-sm">Sign In</a>
      </div>

      <button class="nav-toggle-btn" id="navToggleBtn" aria-label="Toggle Menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
      </button>
    </div>
  </header>

  <!-- Register Form Main Section -->
  <main class="main-content auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-icon-circle">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
            <circle cx="8.5" cy="7" r="4"></circle>
            <line x1="20" y1="8" x2="20" y2="14"></line>
            <line x1="23" y1="11" x2="17" y2="11"></line>
          </svg>
        </div>
        <h1 class="auth-title">Create an Account</h1>
        <p class="auth-subtitle">Join the developer writing community and start posting today</p>
      </div>

      <!-- Feedback Alert Banner -->
      <div id="registerAlertBanner" class="alert-banner"></div>

      <form id="registerForm" novalidate>
        <div class="form-group">
          <label for="regName" class="form-label">Full Name</label>
          <input 
            type="text" 
            id="regName" 
            class="form-control" 
            placeholder="e.g. Maya Patel" 
            required 
            autocomplete="name"
          >
          <div class="form-error-msg"></div>
        </div>

        <div class="form-group">
          <label for="regEmail" class="form-label">Email Address</label>
          <input 
            type="email" 
            id="regEmail" 
            class="form-control" 
            placeholder="name@example.com" 
            required 
            autocomplete="email"
          >
          <div class="form-error-msg"></div>
        </div>

        <div class="form-group">
          <label for="regPassword" class="form-label">Password</label>
          <div class="password-wrapper">
            <input 
              type="password" 
              id="regPassword" 
              class="form-control" 
              placeholder="At least 6 characters" 
              required 
              autocomplete="new-password"
            >
            <button 
              type="button" 
              class="password-toggle-btn" 
              data-target="regPassword" 
              aria-label="Toggle password visibility"
            >
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
          <div class="form-error-msg"></div>
        </div>

        <div class="form-group">
          <label for="regConfirmPassword" class="form-label">Confirm Password</label>
          <div class="password-wrapper">
            <input 
              type="password" 
              id="regConfirmPassword" 
              class="form-control" 
              placeholder="Re-enter password" 
              required 
              autocomplete="new-password"
            >
            <button 
              type="button" 
              class="password-toggle-btn" 
              data-target="regConfirmPassword" 
              aria-label="Toggle password visibility"
            >
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
          <div class="form-error-msg"></div>
        </div>

        <button type="submit" class="btn btn-primary btn-block btn-lg" id="registerSubmitBtn">
          Register & Continue
        </button>
      </form>

      <div class="auth-footer">
        Already have an account? <a href="login.html">Sign In</a>
      </div>
    </div>
  </main>

  <!-- Global Footer -->
  <footer class="site-footer" style="padding: 2.5rem 0 1.5rem;">
    <div class="container footer-bottom" style="border-top: none; padding-top: 0; justify-content: center; text-align: center;">
      <p>&copy; 2026 Blogify. Protected demo environment with LocalStorage persistence.</p>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
